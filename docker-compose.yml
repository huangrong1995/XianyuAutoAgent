services:
  selenium:
    image: selenium/standalone-chromium:4.43.0
    container_name: selenium
    ports:
      - "127.0.0.1:4444:4444"    # Selenium Grid
      - "127.0.0.1:7900:7900"    # noVNC web界面
    environment:
      - SE_SCREEN_WIDTH=1920
      - SE_SCREEN_HEIGHT=1080
      - SE_START_XVFB=true
      - DISPLAY=:99
    shm_size: '2g'
    networks:
      - xianyu-network
    restart: always

  XianyuAutoAgent:
    image: shaxiu/xianyuautoagent:2.0
    container_name: xianyuautoagent
    restart: always
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts
      - ./images:/app/images
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      - SELENIUM_URL=http://selenium:4444
    networks:
      - xianyu-network
    depends_on:
      - selenium

networks:
  xianyu-network:
    driver: bridge
